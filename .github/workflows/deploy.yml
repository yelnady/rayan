name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Backend - Google Cloud Run
  deploy-backend:
    name: Deploy Backend (Cloud Run)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(toJson(github.event.commits.*.modified), 'backend/') ||
      contains(toJson(github.event.commits.*.added), 'backend/') ||
      contains(toJson(github.event.commits.*.removed), 'backend/') ||
      contains(toJson(github.event.commits.*.renamed), 'backend/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build image via Cloud Build
        run: |
          BUILD_ID=$(gcloud builds submit ./backend \
            --tag gcr.io/rayan-memory/rayan-backend \
            --project rayan-memory \
            --async \
            --format="value(id)")
          echo "Build started: $BUILD_ID"
          while true; do
            STATUS=$(gcloud builds describe "$BUILD_ID" \
              --project rayan-memory \
              --format="value(status)")
            echo "Status: $STATUS"
            case "$STATUS" in
              SUCCESS) echo "Build succeeded"; break ;;
              FAILURE|CANCELLED|TIMEOUT|INTERNAL_ERROR)
                echo "Build failed: $STATUS"; exit 1 ;;
            esac
            sleep 15
          done

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy rayan-backend \
            --image gcr.io/rayan-memory/rayan-backend \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --session-affinity \
            --memory 2Gi \
            --cpu 2 \
            --timeout 300 \
            --min-instances 1 \
            --concurrency 80 \
            --service-account rayan-backend@rayan-memory.iam.gserviceaccount.com \
            --project rayan-memory \
            --set-env-vars "^@^DEBUG=false@GOOGLE_CLOUD_PROJECT=rayan-memory@FIREBASE_PROJECT_ID=rayan-memory@MEDIA_BUCKET=rayan-media-rayan-memory@CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}"

      - name: Print service URL
        run: |
          URL=$(gcloud run services describe rayan-backend \
            --region us-central1 \
            --project rayan-memory \
            --format "value(status.url)")
          echo "Backend deployed: $URL"
          echo "Health: $URL/health"
          echo "Docs: $URL/docs"

  # Frontend - Firebase Hosting
  deploy-frontend:
    name: Deploy Frontend (Firebase Hosting)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(toJson(github.event.commits.*.modified), 'frontend/') ||
      contains(toJson(github.event.commits.*.added), 'frontend/') ||
      contains(toJson(github.event.commits.*.removed), 'frontend/') ||
      contains(toJson(github.event.commits.*.renamed), 'frontend/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build production bundle
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: rayan-memory.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: rayan-memory
          VITE_FIREBASE_STORAGE_BUCKET: rayan-memory.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "387066014007"
          VITE_FIREBASE_APP_ID: "1:387066014007:web:f794cf723f7673ea7612b2"
          VITE_FIREBASE_MEASUREMENT_ID: G-QXBT6G0STM

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --project rayan-memory
        working-directory: frontend
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Print hosting URL
        run: echo "Frontend deployed https://rayan-memory.web.app"
